<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>simple-pm2-monitor</title>
  <rect width="128" height="128" rx="30" fill="#1B2A4E"/>
  <!-- orbit: restart/cycle arc with arrow head -->
  <path d="M64 24 A40 40 0 1 1 35.7 35.7" fill="none" stroke="#3E5A8F" stroke-width="6" stroke-linecap="round"/>
  <path d="M43.5 27.9 L41.3 41.3 L30.1 30.1 Z" fill="#3E5A8F" stroke="#3E5A8F" stroke-width="3" stroke-linejoin="round"/>
  <!-- links -->
  <g stroke="#3E5A8F" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="64" x2="64" y2="24"/>
    <line x1="64" y1="64" x2="98.6" y2="84"/>
    <line x1="64" y1="64" x2="29.4" y2="84"/>
  </g>
  <!-- process nodes (status) -->
  <circle cx="64" cy="24" r="10" fill="#6EE7B7"/>
  <circle cx="98.6" cy="84" r="10" fill="#6EE7B7"/>
  <circle cx="29.4" cy="84" r="10" fill="#FFC857"/>
  <!-- central hub -->
  <circle cx="64" cy="64" r="17" fill="#00ADD8"/>
  <circle cx="64" cy="64" r="6.5" fill="#1B2A4E"/>
</svg>
